# Зарубежный вход Половинки: один контейнер Caddy. Настройки — в .env рядом (EDGE_DOMAIN, ORIGIN).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN}
      ORIGIN: ${ORIGIN:-polovinka.online}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
