# Боевой запуск на VPS: приложение + Caddy с автоматическим TLS.
# 1. Направьте A-запись домена на сервер.
# 2. cp .env.example .env и заполните DOMAIN, STATS_KEY, VAPID_EMAIL
# 3. docker compose up -d --build
# Подробно: docs/DEPLOY.md
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:-localhost}
      STATS_KEY: ${STATS_KEY:-}
      VAPID_SUBJECT: mailto:${VAPID_EMAIL:-hello@example.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATA_LOCATION: ${DATA_LOCATION:-}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      CROWD_MIN: ${CROWD_MIN:-20}
    volumes:
      - app-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
